{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow-sm">
    <h3>🛠️ Instrument Diagnostic Rețea</h3>
    <p class="text-muted">Verifică disponibilitatea nodurilor de transport (Ping).</p>
    
    <form action="/network-check" method="POST">
        <div class="input-group mb-3">
            <input type="text" name="ip_address" class="form-control" placeholder="Introdu IP-ul (ex: 127.0.0.1)">
            <button class="btn btn-danger" type="submit">Execută Ping</button>
        </div>
    </form>

    {% if result %}
    <div class="mt-3">
        <h5>Rezultat Terminal:</h5>
        <div class="bg-black text-success p-3 rounded">
            <code>{{ result }}</code>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
